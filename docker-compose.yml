services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sis-cbta254-app
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      # Sobrescribe DB para usar el servicio 'db' dentro de Docker
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sistema_dgetaycm
      DB_USERNAME: cbta_user
      DB_PASSWORD: cbta_secret
      # Evita problemas de cache con APP_URL dentro de contenedor
      APP_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache

  db:
    image: mysql:8.4
    container_name: sis-cbta254-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sistema_dgetaycm
      MYSQL_USER: cbta_user
      MYSQL_PASSWORD: cbta_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306" # host 3307 para no chocar con MySQL local en 3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  db_data:
  storage_data:
  bootstrap_cache:
