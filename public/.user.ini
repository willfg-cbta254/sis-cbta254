; Límites de subida de archivos (imágenes del hero hasta 5 MB, video hasta 100 MB).
; Requerido por el módulo "Página Principal" para que las subidas no se queden
; colgadas cuando el archivo excede el límite por defecto de PHP.
upload_max_filesize = 100M
post_max_size = 108M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
