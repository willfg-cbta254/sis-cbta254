# Redirección de HTTP a HTTPS y validación de Certbot
server {
    listen 80;
    server_name tudominio.com www.tudominio.com;

    # Ruta requerida por Certbot para validar la propiedad del dominio
    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    # Redirigir el resto del tráfico a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Configuración HTTPS principal
server {
    listen 443 ssl http2;
    server_name tudominio.com www.tudominio.com;

    index index.php index.html;
    root /var/www/html/public;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Certificados SSL de Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;

    # Parámetros recomendados de seguridad SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
